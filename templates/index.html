<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card Fraud Detection</title>

    <style>
     body {
        margin: 0;
        padding: 0;
        min-height: 100vh; 
        background: url('/static/many-credit-cards-on-blurred-600nw-2478118299.jpg');
        background-size: cover; 
        background-position: center; 
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: "Poppins", sans-serif;
       
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
      }

      
      .container {
        position: relative;
        z-index: 10;
        width: 400px;
        padding: 35px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.18);
        text-align: center;
        color: #fff;
        backdrop-filter: blur(10px);
      }

      
      .card-icon {
        width: 70px;
        height: 70px;
        margin-bottom: 10px;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
      }

      h2 {
        font-size: 1.7rem;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        letter-spacing: 1px;
      }

      label {
        display: block;
        text-align: left;
        margin: 10px 0 5px 5px;
        font-weight: 600;
        font-size: 0.9rem;
        color: #f8f8f8;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box; 
        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 1rem;
        outline: none;
        transition: 0.3s ease;
      }

      input::placeholder {
        color: #ddd;
      }

      input:focus {
        background: rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      button {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: bold;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        transition: all 0.3s ease;
      }

      button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(0, 162, 255, 0.7);
        background: linear-gradient(135deg, #0072ff, #00c6ff);
      }

      footer {
        width: 100%;
        text-align: center;
        color: white;
        font-size: 0.85rem;
        opacity: 0.8;
        padding: 20px 0;
      }
      
      
      .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
      }
      .result.fraud {
            background-color: #f8d7da; 
            color: #721c24;
            border: 1px solid #f5c6cb;
      }
      .result.legit {
            background-color: #d4edda; 
            color: #155724;
            border: 1px solid #c3e6cb;
      }


      @media screen and (max-width: 480px) {
        .container {
          width: 90%;
          padding: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img
        class="card-icon"
        src="https://cdn-icons-png.flaticon.com/512/633/633611.png"
        alt="Credit Card Icon"
      />
      <h2>Credit Card Fraud Detection</h2>

      <form action="{{url_for('predict')}}" method="post">
        
        <label>Time:</label>
        <input type="number" name="Time" placeholder="Enter time in seconds" required />

        <label>V1:</label>
        <input type="text" name="V1" placeholder="Enter V1 value" required />

        <label>V2:</label>
        <input type="text" name="V2" placeholder="Enter V2 value" required />

        <label>V3:</label>
        <input type="text" name="V3" placeholder="Enter V3 value" required />

        <label>V4:</label>
        <input type="text" name="V4" placeholder="Enter V4 value" required />

        <label>V5:</label>
        <input type="text" name="V5" placeholder="Enter V5 value" required />

        <label>Amount:</label>
        <input type="text" name="Amount" placeholder="Enter amount in dollars" required />

        <button type="submit">Predict</button>
      </form>
      
      {% if prediction_text %}
        <div class="result {{ 'legit' if 'LEGITIMATE' in prediction_text else 'fraud' }}">
            {{ prediction_text }}
        </div>
      {% endif %}
      
    </div>
    
    <footer>
      © 2025 Credit Card Fraud Detection | Mini Project by Sandeep Bisht
    </footer>

  </body>
</html>
